services:
  frontend:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    container_name: marriage-frontend-local
    env_file:
      - .env
    environment:
      # next dev в bind-mount volume не видит fs-события — переключаем на polling.
      WATCHPACK_POLLING: "true"
    ports:
      - "${NEXT_PUBLIC_PORT:-3000}:${NEXT_PUBLIC_PORT:-3000}"
    volumes:
      - .:/app
      - marriage-frontend-node-modules:/app/node_modules
    networks:
      - app-network
    restart: unless-stopped

volumes:
  marriage-frontend-node-modules:

networks:
  app-network:
    driver: bridge
