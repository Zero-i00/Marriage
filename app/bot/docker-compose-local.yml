services:
  bot:
    build:
      context: .
      dockerfile: docker/local/Dockerfile
    container_name: marriage-bot-local
    env_file:
      - .env
    volumes:
      - .:/app
    # временно: host network, чтобы api.telegram.org шёл через VPN хоста напрямую, без прокси-контейнера
    network_mode: host
    depends_on:
      - backend
#      - proxy
    restart: unless-stopped

