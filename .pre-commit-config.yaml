repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (backend)
        entry: bash -c 'cd app/backend && uv run ruff check --fix'
        language: system
        files: ^app/backend/.*\.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format (backend)
        entry: bash -c 'cd app/backend && uv run ruff format'
        language: system
        files: ^app/backend/.*\.py$
        pass_filenames: false

      - id: ruff-check-bot
        name: ruff check (bot)
        entry: bash -c 'cd app/bot && uv run ruff check --fix'
        language: system
        files: ^app/bot/.*\.py$
        pass_filenames: false

      - id: ruff-format-bot
        name: ruff format (bot)
        entry: bash -c 'cd app/bot && uv run ruff format'
        language: system
        files: ^app/bot/.*\.py$
        pass_filenames: false

      - id: biome
        name: biome check --write (frontend)
        entry: bash -c 'cd app/frontend && bun run biome check --write'
        language: system
        files: ^app/frontend/.*\.(ts|tsx|js|jsx|mjs|cjs|json|css)$
        pass_filenames: false
